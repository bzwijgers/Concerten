name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p probe
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL -m 40 -A "Mozilla/5.0 (compatible; ConcertAgendaBot/1.0)" -o "probe/$name.html" -w "$name %{http_code} %{size_download}\n" "$url" || echo "$name FAIL"
          done < probe_urls.txt | tee probe/_status.txt
      - name: commit
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe; git commit -m "probe results" || true; git push
