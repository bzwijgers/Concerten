name: probe3
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p probe3
          UA="Mozilla/5.0 (compatible; BarrysConcertAgenda/1.0; persoonlijk gebruik)"
          g() { curl -sSL -m 40 -b probe3/cj -c probe3/cj -A "$UA" -H "Accept-Language: nl" -o "probe3/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" || echo "$1 FAIL"; sleep 5; }
          { g amare_agenda1.html https://www.amare.nl/nl/agenda
          g amare_agenda2.html "https://www.amare.nl/nl/agenda?page=2"
          g amare_ev1.html https://www.amare.nl/nl/agenda/ladysmith-black-mambazo-y3d1
          g amare_ev2.html https://www.amare.nl/nl/agenda/dire-straits-experience-the-long-highway-tour-2026-4m56
          g amare_ev3.html https://www.amare.nl/nl/agenda/dvorak-5-q83j
          g tolhuistuin_agenda2.html https://tolhuistuin.nl/agenda/
          } | tee probe3/_status2.txt
      - name: commit
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add -f probe3; git commit -m "probe3 amare" || true; git pull --rebase -q origin main; git push
