name: update
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 06:00/07:00 Amsterdam; second run below covers summer/winter shift
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths: ["data/inbox/**"]
permissions:
  contents: write
  issues: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install beautifulsoup4 lxml pillow
      - name: Only run at 07:00 Amsterdam time (or when started by hand)
        id: gate
        run: |
          H=$(TZ=Europe/Amsterdam date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$H" = "07" ]; then echo run=1 >> $GITHUB_OUTPUT; else echo run=0 >> $GITHUB_OUTPUT; fi
      - name: Scrape
        if: steps.gate.outputs.run == '1'
        run: python scraper/main.py
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
      - name: Logo's van nieuwe zalen
        if: steps.gate.outputs.run == '1'
        run: python tools/logos.py || true
      - name: Commit data
        if: steps.gate.outputs.run == '1'
        run: |
          git config user.name "concert-agenda-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A data docs/data docs/thumbs docs/logos
          git diff --cached --quiet || git commit -m "Update concerten $(date -u +%F)"
          # botst dit met een andere update die net klaar was: de gegevens van deze (nieuwere) run winnen
          git pull --rebase -X theirs -q origin main || { git checkout --theirs . 2>/dev/null; git add -A; GIT_EDITOR=true git rebase --continue; }
          git push
      - name: Melding bij problemen met zalen
        continue-on-error: true
        if: steps.gate.outputs.run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Zalen met problemen"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number --jq '.[0].number' || true)
          if [ -f data/alerts.md ]; then
            if [ -z "$N" ]; then gh issue create --title "$T" --body-file data/alerts.md
            else
              gh issue edit "$N" --body-file data/alerts.md
              [ -f data/alerts.changed ] && gh issue comment "$N" --body "Gewijzigd: $(grep -c '^- ' data/alerts.md) zaal/zalen met problemen. @bzwijgers" || true
            fi
          elif [ -n "$N" ]; then
            gh issue close "$N" --comment "Alles werkt weer. @bzwijgers"
          fi
