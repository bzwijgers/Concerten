name: android
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: write
concurrency:
  group: android
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.9" }
      - name: Bouw APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Zet APK in de app-map
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk docs/barrys-concert-agenda.apk
          git config user.name "concert-agenda-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f docs/barrys-concert-agenda.apk
          git diff --cached --quiet || git commit -m "APK bijgewerkt"
          git pull --rebase -q origin main || true
          git push
      - uses: actions/upload-artifact@v7
        with: { name: apk, path: docs/barrys-concert-agenda.apk }
