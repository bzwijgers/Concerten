<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a12"><meta name="mobile-web-app-capable" content="yes">
<title>Barry's concert agenda</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with three tabs, venue filter strip, then a day-grouped list of concert rows with mark buttons and two outbound links. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --fg:#14171F; --muted:#5B6270; --line:#D8DCE3;
  --accent:#3341E8; --accent-fg:#FFFFFF; --ticket:#0B7F52; --interest:#9A5B00; --sold:#8A91A0;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1117; --surface:#171B24; --fg:#EEF0F4; --muted:#98A0AE; --line:#2A303C;
    --accent:#8F9BFF; --accent-fg:#0E1117; --ticket:#3DD598; --interest:#F2B84B; --sold:#6C7380;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#171B24; --fg:#EEF0F4; --muted:#98A0AE; --line:#2A303C;
  --accent:#8F9BFF; --accent-fg:#0E1117; --ticket:#3DD598; --interest:#F2B84B; --sold:#6C7380;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;padding-inline:16px}
*{box-sizing:border-box}
.wrap{max-width:720px;margin:0 auto;padding-block:0 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stamp{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;white-space:nowrap;padding-inline:10px!important;appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 13px var(--f-body);padding:10px 2px 9px;cursor:pointer;display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;font-weight:500;background:var(--line);color:var(--fg);border-radius:9px;padding:1px 6px}
.tab[aria-selected="true"] .n{background:var(--accent);color:var(--accent-fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.search{width:100%;font:400 15px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--f-body);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chipsep{flex:none;align-self:center;font:500 12px var(--f-body);color:var(--muted,var(--fg));opacity:.7;padding-left:8px}
.row2{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted)}
.row2 label{display:flex;gap:6px;align-items:center;cursor:pointer}
.sub{display:flex;gap:6px}
.day{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);display:none}
.dayhead{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.01em;margin:22px 0 8px;display:flex;gap:10px;align-items:baseline}
.dayhead small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.list{display:flex;flex-direction:column;gap:8px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ev.t{border-color:var(--ticket)}
.name{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.venue{font-weight:600;color:var(--fg)}
.badge{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:2px 6px;border:1px solid currentColor}
.badge.new{color:var(--accent)}
.badge.sold{color:var(--sold)}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mk{appearance:none;font:600 13px var(--f-body);border:1px solid var(--line);background:none;color:var(--fg);border-radius:7px;padding:7px 11px;cursor:pointer}
.mk[aria-pressed="true"][data-act="t"]{background:var(--ticket);border-color:var(--ticket);color:var(--surface)}
.mk[aria-pressed="true"][data-act="i"]{background:var(--interest);border-color:var(--interest);color:var(--surface)}
.lk{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;padding:7px 4px}
.lk:hover{text-decoration:underline}
.lk.first{margin-left:auto}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--muted);margin-top:22px}
.empty b{display:block;font-family:var(--f-display);font-size:17px;color:var(--fg);margin-bottom:4px}
.foot{margin-top:30px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.zl{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}.zl a{color:var(--accent,inherit);text-decoration:underline;font-size:13px}.foot summary{cursor:pointer;color:var(--text,inherit);font-weight:600;font-size:13px}.foot code{font-family:var(--f-mono)}
@media (min-width:560px){.acts{flex-wrap:nowrap}}
@media (prefers-reduced-motion:no-preference){.mk,.chip{transition:background .12s,border-color .12s}}

.top a.info{font:600 13px var(--f-body);color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.warn{border:1px solid var(--interest);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;color:var(--fg)}
.badge.club{color:var(--ticket)}
.src{font-size:12px;color:var(--muted)}

#splash{position:fixed;inset:0;z-index:99;background:#0a0a12 url(../img/splash.jpg) center/cover no-repeat;transition:opacity .5s ease;display:flex;align-items:flex-end;justify-content:center;padding-bottom:max(48px,env(safe-area-inset-bottom))}
#splash.gone{opacity:0;pointer-events:none}
#splash span{color:#fff;opacity:.75;font:500 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
</style><link rel="icon" href="../img/icon-192.png"><link rel="apple-touch-icon" href="../img/icon-192.png"></head><body>
<div id="splash" role="img" aria-label="Barry's concerten"><span>Programma laden…</span></div>
<div class="wrap">
  <header>
    <div class="top"><h1>Barry's concert agenda</h1><a class="info" href="../info.html">Info</a></div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="all" aria-selected="true">Alles <span class="n" id="n-all">0</span></button>
      <button class="tab" role="tab" data-tab="new" aria-selected="false">Nieuw <span class="n" id="n-new">0</span></button>
      <button class="tab" role="tab" data-tab="t" aria-selected="false">Ticket <span class="n" id="n-t">0</span></button>
      <button class="tab" role="tab" data-tab="i" aria-selected="false">Interesse <span class="n" id="n-i">0</span></button>
      <button class="tab" role="tab" data-tab="c" aria-selected="false">Rotown club <span class="n" id="n-c">0</span></button>
      <button class="tab" role="tab" data-tab="a" aria-selected="false">Archief <span class="n" id="n-a">0</span></button>
    </div>
  </header>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Zoek artiest of zaal" autocomplete="off">
    <div class="chips" id="venues"></div>
    <div class="row2"><label for="hideSold"><input type="checkbox" id="hideSold"> Verberg uitverkocht</label><span class="src" id="stamp"></span></div>
  </div>
  <div id="warn"></div>
  <main id="out" aria-live="polite"><div class="empty"><b>Laden…</b>De agenda wordt opgehaald.</div></main>
  <div class="foot"><span>Gegevens komen van de websites van de zalen zelf en worden elke ochtend rond 07:00 bijgewerkt. Meer uitleg staat op de <a href="../info.html">infopagina</a>.</span></div>
</div>
<script>
(function(){var sp=document.getElementById("splash"),t0=Date.now(),done=false;
function hide(){if(done)return;done=true;sp.classList.add("gone");setTimeout(function(){sp.remove();},700);}
window.__splashReady=function(){setTimeout(hide,Math.max(0,1400-(Date.now()-t0)));};
sp.addEventListener("click",hide);setTimeout(hide,6000);})();
</script>
<script src="app.js"></script>
</body></html>
