name: pages
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_run:
    workflows: ["update", "android"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - name: Versienummer (de app ziet zo dat er een nieuwe versie is)
        run: echo "{\"v\":\"${GITHUB_SHA::7}\",\"at\":\"$(date -u +%FT%TZ)\"}" > docs/version.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: docs }
      # GitHub vindt het pakket soms net niet ("No artifacts named github-pages"): dan na een halve minuut nog twee keer proberen
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 60
      - if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v5
