<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c12">
<link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="img/icon-192.png"><link rel="apple-touch-icon" href="img/icon-192.png">
<title>Barry's concert agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Voorstel nieuw uiterlijk, versie 2: donker zoals de startfoto, goud van de lampjes als accent */
:root{--bg:#0d0c12;--bg2:#15131c;--card:#1c1a25;--card2:#24212f;--line:#2e2a3a;--fg:#f3efe6;--muted:#a49db3;--faint:#7a7389;
  --gold:#f2b84b;--acc:#ece6d8;--acc-ink:#15131c;--soft:#8e9bc4;--red:#ff6b6b;--green:#4fd18b;--blue:#8fb2ff;
  --f-d:"Bricolage Grotesque",system-ui,sans-serif;--f-b:"Instrument Sans",system-ui,sans-serif;--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.4 var(--f-b)}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid transparent;transition:border-color .2s}
header.sc{border-bottom-color:var(--line)}
.top{display:flex;align-items:center;gap:8px}
.brand{font:800 clamp(16px,5.2vw,22px) var(--f-d);letter-spacing:-.02em;display:flex;align-items:center;gap:6px;flex:1;min-width:0;white-space:nowrap}
.brand svg{flex:none}
.flagb{border:0;background:none;padding:6px 2px;margin:-6px 0;cursor:pointer;display:inline-flex;transition:opacity .15s}
.flagb svg{width:22px;height:15px;border-radius:2px;box-shadow:0 0 0 .5px rgba(255,255,255,.25)}
.brand.cc .flagb{opacity:.3}.brand.cc .flagb[aria-pressed=true]{opacity:1}
.brand.cc .flagb[aria-pressed=true] svg{box-shadow:0 0 0 2px var(--acc)}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--fg);text-decoration:none;flex:none}
.ib svg{width:19px;height:19px}
.ib[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.brand svg{width:20px;height:13px;border-radius:2px;box-shadow:0 0 0 .5px rgba(255,255,255,.25)}
.top{position:relative}
.menu{position:absolute;right:16px;top:58px;z-index:40;min-width:220px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;background:none;border-radius:10px;color:var(--fg);text-decoration:none;font:600 14px var(--f-b);cursor:pointer;text-align:left}
.menu a:active,.menu button:active{background:var(--card)}
.menu svg{width:18px;height:18px;color:var(--muted)}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.vrow input{width:20px;height:20px;accent-color:var(--acc)}
.vrow b{flex:1;font:600 14px var(--f-b)}.vrow span{font-size:12px;color:var(--faint)}
.sbar{display:none;margin-top:10px;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.sbar.on{display:flex}
.sbar svg{width:18px;height:18px;color:var(--faint);flex:none}
.sbar input{flex:1;background:none;border:0;outline:none;color:var(--fg);font:500 15px var(--f-b);padding:11px 0;min-width:0}
.sbar .x{border:0;background:none;color:var(--faint);font-size:18px;cursor:pointer;display:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 13px var(--f-b);cursor:pointer;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip.city{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hl{font:700 12px var(--f-b);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:20px 0 10px}
/* volgende concert */
.next{position:relative;border-radius:20px;overflow:hidden;min-height:180px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--card);border:1px solid var(--line);cursor:pointer}
.next .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(14px) brightness(.45);transform:scale(1.2)}
.next>*{position:relative}
.next .cd{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.14);color:var(--fg);backdrop-filter:blur(6px);font:800 13px var(--f-d);padding:6px 10px;border-radius:10px}
.next .nn{font:800 26px/1.1 var(--f-d);letter-spacing:-.02em}
.next .nv{color:var(--muted);margin-top:6px;font-size:14px}
.next .lg{width:56px;height:56px;border-radius:14px;margin-bottom:12px}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.strip::-webkit-scrollbar{display:none}
.mc{flex:none;width:210px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.mc .lg{width:42px;height:42px;border-radius:11px}
.mc b{display:block;font:700 14px/1.2 var(--f-d);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mc span{font-size:12px;color:var(--muted)}
/* logo's: één rustig vak; lichte logo's worden omgekeerd zodat alles donker is */
.lg{object-fit:cover;background:var(--card2);box-shadow:0 0 0 1px var(--line)}
.lg.inv{filter:invert(1) hue-rotate(180deg) brightness(1.15)}
/* lijst */
.day{position:sticky;top:var(--hh,150px);z-index:5;background:var(--bg);padding:16px 0 6px;display:flex;align-items:baseline;gap:10px}
.day b{font:800 19px var(--f-d)}
.day span{color:var(--faint);font-size:13px}
.ev{display:flex;gap:12px;align-items:center;padding:9px 10px;margin:0 -10px;border-radius:14px;cursor:pointer}
.ev:active{background:var(--card)}
.ev .lg,.ev .lt{width:50px;height:50px;border-radius:13px;flex:none}
.lt{display:grid;place-items:center;font:800 20px var(--f-d);color:var(--muted);background:var(--card2)}
.ev .b{flex:1;min-width:0}
.ev .n{font:700 15.5px/1.25 var(--f-d);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ev .tm{font:700 14px var(--f-d);text-align:right;flex:none;min-width:46px}
.ev .tm small{display:block;font:500 11px var(--f-b);color:var(--faint)}
.ev .tm.none{font:500 11px var(--f-b);color:var(--faint)}
.bd{display:inline-block;font:700 10px var(--f-b);text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:6px;margin-right:5px;vertical-align:1px}
.bd.tk{background:var(--green);color:#06210f}.bd.so{background:rgba(255,107,107,.18);color:var(--red)}
.bd.nw{background:rgba(242,184,75,.18);color:var(--gold)}.bd.fe{background:rgba(143,178,255,.18);color:var(--blue)}.bd.cl{background:rgba(79,209,139,.15);color:var(--green)}
.ev.star .n::after{content:" ★";color:var(--gold)}
.others{display:block;width:100%;margin:6px 0 4px;padding:12px;border-radius:12px;border:1px dashed var(--line);background:none;color:var(--muted);cursor:pointer;font:600 13px var(--f-b)}
.seg{display:flex;gap:4px;padding:4px;background:var(--card);border-radius:12px;margin-top:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:600 14px var(--f-b);color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card2);color:var(--fg)}
/* overzicht */
.mapbox{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:6px}
.map{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.map .land{fill:#1d1b26;stroke:#3a3548;stroke-width:1;vector-effect:non-scaling-stroke}
.map .be{fill:#191722}
.map .reach{fill:#fff;fill-opacity:.04;stroke:#fff;stroke-opacity:.35;stroke-dasharray:4 3;stroke-width:1.2;vector-effect:non-scaling-stroke}
.map .reach.on{fill-opacity:.14}
.map .home{fill:var(--fg)}
.map .ml{fill:var(--muted);font-family:var(--f-b);font-weight:600;pointer-events:none}
.map .cl{fill:var(--faint);font-family:var(--f-d);font-weight:800;letter-spacing:.08em;pointer-events:none}
.map circle[data-city]{cursor:pointer}
.zoom{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:700 17px var(--f-b);cursor:pointer}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;border:0;background:none;width:100%;color:var(--fg)}
.mrow span{width:58px;text-align:left;font:600 14px var(--f-b)}
.mrow i{flex:1;height:10px;border-radius:5px;background:var(--card);overflow:hidden}
.mrow i b{display:block;height:100%;background:var(--soft);border-radius:5px}
.mrow em{width:46px;text-align:right;font:600 13px var(--f-b);font-style:normal;color:var(--muted)}
.regrow{border-top:1px solid var(--line);padding:12px 2px}.regrow span{font-weight:700}
.mrow.on span,.mrow.on em{color:var(--fg);font-weight:700}
/* concertscherm */
.sheet{position:fixed;inset:0;z-index:30;display:none}
.sheet.on{display:block}
.sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:0 0 calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.ph{position:relative;height:190px;background:var(--card2) center/cover;border-radius:24px 24px 0 0}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(21,19,28,0) 40%,var(--bg2));border-radius:24px 24px 0 0}
.grab{position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:rgba(255,255,255,.4);z-index:2}
.pb{padding:0 18px;margin-top:-48px;position:relative}
.pb .lg{width:64px;height:64px;border-radius:16px}
.pb h2{font:800 25px/1.12 var(--f-d);margin:12px 0 6px;letter-spacing:-.02em}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.fact{background:var(--card);border-radius:14px;padding:12px}
.fact span{display:block;font-size:12px;color:var(--faint)}
.fact b{font:700 15px var(--f-d)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:600 14px var(--f-b);cursor:pointer;text-align:center;text-decoration:none;color:var(--fg);display:flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.on{background:var(--green);border-color:var(--green);color:#06210f}
.btn.wide{grid-column:1/-1}
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;min-height:var(--nav);height:var(--nav);height:calc(var(--nav) + env(safe-area-inset-bottom, 0px));padding-bottom:env(safe-area-inset-bottom, 0px);background:#15131c;border-top:1px solid var(--line);display:flex;justify-content:center;-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform}
nav button,nav a{flex:1;max-width:160px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 11px var(--f-b);color:var(--faint);cursor:pointer;text-decoration:none}
nav svg{width:22px;height:22px}
nav [aria-selected=true]{color:var(--fg)}
nav [aria-selected=true] svg{stroke-width:2.4}
.note{margin:24px 0;padding:14px;border-radius:14px;background:var(--card);color:var(--muted);font-size:13px;border:1px dashed var(--line)}
.note a{color:var(--fg)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
@media (min-width:1000px){.wrap{max-width:900px}}
#splash{position:fixed;inset:0;z-index:99;background:#0a0a12;transition:opacity .4s ease;display:flex;align-items:flex-end;justify-content:center;padding:0 20px max(40px,env(safe-area-inset-bottom));cursor:pointer}
#splash.gone{opacity:0;pointer-events:none}
html.inapp.splashing,html.inapp.splashing body{background:transparent}
html.inapp #splash{background:transparent}
/* startscherm vult het hele scherm: de foto groot in beeld, daarachter een vage vergroting van dezelfde foto */
#splash{overflow:hidden}
#splash::before{content:"";position:absolute;inset:-40px;background:url(img/splash_art.jpg) center/cover no-repeat;filter:blur(22px) brightness(.6)}
#splash::after{content:"";position:absolute;inset:0;background:url(img/splash_art.jpg) 50% 18%/cover no-repeat}
#splash .sb{position:relative;z-index:1}
@media (orientation:landscape){#splash::after{background-size:contain;background-position:center}}
#splash .sb{background:rgba(10,10,18,.72);color:#fff;border-radius:14px;padding:12px 18px;text-align:center;max-width:340px;width:100%}
#splash .st{font:500 13px var(--f-b);letter-spacing:.04em;opacity:.85}
#splash .go{display:none;margin-top:8px;font:600 15px var(--f-b);letter-spacing:.02em}
#splash.ready .go{display:block}
#splash.ready .st:empty{display:none}#splash.ready .go{margin-top:0}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
.arow.open{background:var(--card);border-radius:14px;margin:4px -10px;padding:0 10px 12px}
.aedit{padding:4px 0 0}
.rate{display:grid;grid-template-columns:repeat(10,minmax(0,1fr)) 36px;align-items:center;gap:0;margin:6px 0 10px}
.rs,.rz{border:0;background:none;padding:4px 0;cursor:pointer;display:grid;place-items:center}
.rs svg{width:min(26px,100%);height:26px;fill:none;stroke:var(--faint);stroke-width:1.6;stroke-linejoin:round}
.rs.full svg{fill:var(--gold);stroke:var(--gold)}.rs.half svg{fill:url(#halfgold);stroke:var(--gold)}
.rz{font:700 12px var(--f-b);color:var(--faint);border:1px solid var(--line);border-radius:8px;height:28px}.rz.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.aedit textarea{width:100%;min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:400 14px var(--f-b);padding:10px;resize:vertical}
.lnk{border:0;background:none;color:var(--faint);font:600 13px var(--f-b);padding:10px 0 0;cursor:pointer;text-decoration:underline}
.conf{margin-top:10px;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.stat{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font:800 22px var(--f-d)}.stat span{font-size:12px;color:var(--muted)}
.trow{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}.trow b{font-weight:700}
</style>
</head>

<script>
(function(){var sp=document.getElementById("splash"),done=false,ready=false,seen=false;
