name: update
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 06:00/07:00 Amsterdam; second run below covers summer/winter shift
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths: ["data/inbox/**"]
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install beautifulsoup4 lxml
      - name: Only run at 07:00 Amsterdam time (or when started by hand)
        id: gate
        run: |
          H=$(TZ=Europe/Amsterdam date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$H" = "07" ]; then echo run=1 >> $GITHUB_OUTPUT; else echo run=0 >> $GITHUB_OUTPUT; fi
      - name: Scrape
        if: steps.gate.outputs.run == '1'
        run: python scraper/main.py
      - name: Commit data
        if: steps.gate.outputs.run == '1'
        run: |
          git config user.name "concert-agenda-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A data docs/data
          git diff --cached --quiet || git commit -m "Update concerten $(date -u +%F)"
          git pull --rebase -q origin main || true
          git push
