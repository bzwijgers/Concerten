name: update
on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 05:00/06:00 Amsterdam; de tweede dekt zomer-/wintertijd
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    paths: ["data/inbox/**"]
permissions:
  contents: write
  issues: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install beautifulsoup4 lxml pillow
      - name: Eén keer per ochtend vanaf 06:00 Amsterdamse tijd (of als hij met de hand / door de pc gestart is)
        id: gate
        run: |
          H=$(TZ=Europe/Amsterdam date +%H); D=$(TZ=Europe/Amsterdam date +%F)
          if [ "${{ github.event_name }}" != "schedule" ]; then echo run=1 >> $GITHUB_OUTPUT
          elif [ "$H" -ge 6 ] && [ "$(cat data/lastsched.txt 2>/dev/null)" != "$D" ]; then echo "$D" > data/lastsched.txt; echo run=1 >> $GITHUB_OUTPUT
          else echo run=0 >> $GITHUB_OUTPUT; fi
      - name: Scrape
        if: steps.gate.outputs.run == '1'
        run: python scraper/main.py
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
      - name: Logo's van nieuwe zalen
        if: steps.gate.outputs.run == '1'
        run: python tools/logos.py || true
      - name: Commit data
        if: steps.gate.outputs.run == '1'
        run: |
          git config user.name "concert-agenda-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A data docs/data docs/thumbs docs/logos
          git diff --cached --quiet || git commit -m "Update concerten $(date -u +%F)"
          # kwamen er tijdens deze run nieuwe commits bij (pc-lijst, app-wijziging): daarbovenop zetten.
          # Gegevens van deze run winnen; een nieuwe pc-lijst in data/inbox blijft staan voor de volgende run.
          for i in 1 2 3 4; do
            git push -q && exit 0
            git fetch -q origin main
            if ! git rebase -q -X theirs origin/main; then
              git diff --name-only --diff-filter=U | while read -r f; do
                if [[ "$f" == data/inbox/* ]] && git cat-file -e "origin/main:$f" 2>/dev/null; then git checkout origin/main -- "$f"
                elif [ -e "$f" ]; then git add "$f"; else git rm -q --cached "$f" 2>/dev/null || true; fi
              done || true
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep 5; }
            fi
          done
          exit 1
      - name: Melding bij problemen met zalen
        continue-on-error: true
        if: steps.gate.outputs.run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Zalen met problemen"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number --jq '.[0].number' || true)
          if [ -f data/alerts.md ]; then
            if [ -z "$N" ]; then gh issue create --title "$T" --body-file data/alerts.md
            else
              gh issue edit "$N" --body-file data/alerts.md
              [ -f data/alerts.changed ] && gh issue comment "$N" --body "Gewijzigd: $(grep -c '^- ' data/alerts.md) zaal/zalen met problemen. @bzwijgers" || true
            fi
          elif [ -n "$N" ]; then
            gh issue close "$N" --comment "Alles werkt weer. @bzwijgers"
          fi
